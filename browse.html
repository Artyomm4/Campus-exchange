<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Campus Exchange Hub — a front-end classified marketplace prototype.">
<title>Browse · Campus Exchange Hub</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="site-header">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="nav-wrap">
    <a class="brand" href="index.html" aria-label="Campus Exchange Hub home">
      <span class="brand-mark">CX</span><span>Campus Exchange Hub</span>
    </a>
    <nav class="nav-links" aria-label="Primary navigation">
      <a class="active" href="browse.html">Browse</a>
      <a class="" href="favorites.html">Favorites</a>
      <a class="" href="create.html" data-role="member">Post listing</a>
      <a class="" href="dashboard.html" data-role="member">My area</a>
      <a class="" href="moderator.html" data-role="moderator">Moderation</a>
    </nav>
    <div class="role-pill" title="Demo role switch — no real authentication is used">
      <span class="badge-dot" aria-hidden="true"></span>
      <label for="roleSelect" class="hidden">Current role</label>
      <select id="roleSelect">
        <option value="visitor">Visitor</option>
        <option value="member">Member</option>
        <option value="moderator">Moderator</option>
      </select>
    </div>
  </div>
</header>

<main id="main">

<div class="container">
  <div class="section-head">
    <div><div class="eyebrow muted">Marketplace</div><h1>Browse listings</h1><p class="muted">Search locally stored demo data. Results update instantly.</p></div>
  </div>
  <section aria-label="Listing filters">
    <form id="filterForm" class="filters" novalidate>
      <div class="field"><label for="search">Keyword</label><input id="search" type="search" maxlength="60" placeholder="e.g. bike, books"></div>
      <div class="field"><label for="category">Category</label><select id="category"><option value="">All categories</option><option>Books</option><option>Electronics</option><option>Furniture</option><option>Bikes</option><option>Clothing</option><option>Other</option></select></div>
      <div class="field"><label for="minPrice">Min price (€)</label><input id="minPrice" type="number" min="0" max="100000" step="1" placeholder="0"></div>
      <div class="field"><label for="maxPrice">Max price (€)</label><input id="maxPrice" type="number" min="0" max="100000" step="1" placeholder="Any"></div>
    </form>
  </section>
  <div class="results-bar"><div id="listingCount" class="muted" aria-live="polite"></div><div id="priceRangeError" class="error hidden" role="alert"></div></div>
  <section id="listingGrid" class="grid cards-3 listing-grid" aria-live="polite"></section>
</div>

</main>
<footer>
  <div class="footer-inner">
    <span>Campus Exchange Hub · Web Application &amp; Software Architecture</span>
    <span>Front-end prototype · localStorage persistence</span>
  </div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
